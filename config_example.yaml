period:
  start: "2025-09-01"
  end: "2026-02-28"

keyword_groups:
  - label: "Инвалидность (общее)"
    patterns:
      - "инвалид\\w*"
      - "ОВЗ"
      - "ограниченные возможности"
      - "ограниченными возможностями"
      - "людей с инвалидностью"
      - "человек с инвалидностью"
      - "лицо с инвалидностью"
      - "лица с инвалидностью"
      - "граждан\\w* с инвалидностью"
      - "нетрудоспособн\\w*"
      - "недееспособн\\w*"
      - "ИПРА"
      - "МСЭ"
      - "группа инвалидности"
      - "особ\\w* потребност\\w*"
      - "женщина с инвалидностью"
      - "ТМНР"
      - "нарушен\\w* здоровь\\w*"
      - "нарушен\\w* развити\\w*"
      - "нарушен\\w* функци\\w*"

  - label: "Особенные дети"
    patterns:
      - "особенн\\w* дет\\w*"
      - "особенн\\w* ребен\\w*"
      - "особ\\w* потребност\\w*"
      - "дети с ОВЗ"
      - "ребенок с ОВЗ"
      - "коррекционн\\w* школ\\w*"
      - "коррекционн\\w* класс\\w*"
      - "надомн\\w* обучен\\w*"
      - "тьютор\\w*"

  - label: "Инклюзия и доступность"
    patterns:
      - "инклюзи\\w*"
      - "доступн\\w* сред\\w*"
      - "безбарьерн\\w*"
      - "пандус\\w*"
      - "подъёмник\\w*"
      - "подъемник\\w*"
      - "универсальн\\w* дизайн\\w*"
      - "адаптивн\\w* спорт\\w*"
      - "адаптивн\\w* физкультур\\w*"
      - "физическая доступност\\w*"
      - "цифровая доступност\\w*"
      - "инклюзивное трудоустройство"
      - "инклюзивное образование"
      - "экстрабилити"
      - "недоступн\\w*"

  - label: "Глухота / нарушения слуха"
    patterns:
      - "глух\\w*"
      - "немой"
      - "немая"
      - "немые"
      - "немота"
      - "слабослыш\\w*"
      - "неслыш\\w*"
      - "слепоглух\\w*"
      - "нарушени\\w* слух\\w*"
      - "слуховой аппарат"
      - "кохлеарн\\w*"
      - "жестов\\w* язык\\w*"
      - "сурдо\\w*"
      - "тифлосурд\\w*"
      - "РЖЯ"
      - "ВОГ"
      - "субтитр\\w*"
      - "SDH"

  - label: "Слепота / нарушения зрения"
    patterns:
      - "слеп\\w*"
      - "незряч\\w*"
      - "слабовид\\w*"
      - "нарушени\\w* зрен\\w*"
      - "тифло\\w*"
      - "брайл\\w*"
      - "белая трост\\w*"
      - "собака-проводник"
      - "собака-поводырь"
      - "ВОС"
      - "брайлевский дисплей"
      - "экранн\\w* чтец\\w*"
      - "скринридер\\w*"
      - "Voice Over"
      - "тактил\\w*"

  - label: "ДЦП / нарушения опорно-двигательного аппарата"
    patterns:
      - "дцп"
      - "церебральн\\w* паралич\\w*"
      - "опорно-двигательн\\w*"
      - "колясочни\\w*"
      - "кресло-коляск\\w*"
      - "инвалидн\\w* коляск\\w*"
      - "протез\\w*"
      - "ампутац\\w*"
      - "парализ\\w*"
      - "парапле\\w*"
      - "тетрапле\\w*"
      - "киборг"
      - "паралитик"
      - "лежач\\w*"
      - "неходяч\\w*"
      - "обездвиж\\w*"
      - "огранич\\w* подвижн\\w*"
      - "огранич\\w* мобильн\\w*"

  - label: "Аутизм / РАС"
    patterns:
      - "аутизм\\w*"
      - "аутич\\w*"
      - "аутенок"
      - "аутята"
      - "аутист\\w*"
      - "РАС"
      - "расстройств\\w* аутист\\w* спектр\\w*"
      - "спектр\\w* аутизм\\w*"
      - "нейроотлич\\w*"
      - "нейроразнообраз\\w*"
      - "нейродиверг\\w*"
      - "нейротипичн\\w*"
      - "маскинг"
      - "сенсорн\\w* чувствительн\\w*"
      - "гиперчувствительн\\w*"
      - "сенсорн\\w* перегрузк\\w*"

  - label: "Ментальные нарушения"
    patterns:
      - "ментальн\\w* нарушен\\w*"
      - "ментальн\\w* инвалид\\w*"
      - "интеллектуальн\\w* нарушен\\w*"
      - "умственн\\w* отсталост\\w*"
      - "синдром Дауна"
      - "даунёнок"
      - "солнечн\\w* дет\\w*"
      - "психическ\\w* расстройств\\w*"
      - "когнитив\\w* нарушен\\w*"
      - "АДК"
      - "сниж\\w* интеллект\\w*"
      - "шизофрен\\w*"
      - "отсталый"
      - "отсталая"
      - "отсталые"

  - label: "Реабилитация и поддержка"
    patterns:
      - "реабилитац\\w*"
      - "абилитац\\w*"
      - "эрготерап\\w*"
      - "логопед\\w*"
      - "дефектолог\\w*"
      - "ассистивн\\w* технолог\\w*"
      - "техническ\\w* средств\\w* реабилитац\\w*"
      - "ТСР"
      - "сопровожд\\w* проживан\\w*"
      - "открытый рынок труда"

  - label: "Стигматизирующая лексика"
    patterns:
      - "дебил\\w*"
      - "калек\\w*"
      - "убог\\w*"
      - "ущербн\\w*"
      - "неполноценн\\w*"
      - "прикованн\\w* к коляск\\w*"
      - "страдает инвалидностью"
      - "страдающ\\w* инвалидн\\w*"
      - "больн\\w* человек"
      - "немощн\\w*"
      - "нахлебни\\w*"
      - "иждивен\\w*"
      - "стигм\\w*"
      - "шизик"
      - "эйблизм"
      - "токенизм"
      - "герой"
      - "герои\\w*"
      - "жертв\\w*"
      - "несправед\\w*"
      - "эксклюзия"
      - "исключени\\w*"
      - "преодоле\\w*"
      - "имбецил\\w*"
      - "идиот\\w*"
      - "сильн\\w* духом"
      - "подопечн\\w*"
      - "исцел\\w*"

classification:
  categories:
    - id: "med_context"
      label: "Медицинский контекст"
      description: "Диагнозы, лечение, реабилитация"
    - id: "fundraising"
      label: "Сбор средств"
      description: "Призывы к пожертвованиям, сборы"
    - id: "help_request"
      label: "Просьба о помощи"
      description: "Конкретные просьбы о помощи"
    - id: "rights_law"
      label: "Права и законодательство"
      description: "Юридические вопросы, законы, льготы"
    - id: "awareness"
      label: "Информирование"
      description: "Просвещение, инклюзия, мероприятия"
    - id: "personal_story"
      label: "Личная история"
      description: "Личный опыт, истории людей"
    - id: "activism"
      label: "Активизм"
      description: "Борьба за права людей с инвалидностью"
    - id: "stigma_topic"
      label: "Стигма"
      description: "Стигматизация людей с инвалидностью"

  tones:
    - id: "patronizing"
      label: "Покровительственный"
    - id: "mocking"
      label: "Насмешливый"
    - id: "pitying"
      label: "Жалостливый"
    - id: "neutral"
      label: "Нейтральный"
    - id: "respectful"
      label: "Уважительный"
    - id: "empowering"
      label: "Вдохновляющий"
    - id: "ironic"
      label: "Ироничный"
    - id: "indignant"
      label: "Возмущенный"

  problem_scopes:
    - id: "personal"
      label: "Личная проблема"
      description: "Проблема конкретного человека"
    - id: "family"
      label: "Семейная"
      description: "Проблема затрагивает семью / ближайшее окружение"
    - id: "community"
      label: "Проблема сообщества"
      description: "Проблема группы людей, организации, сообщества"
    - id: "systemic"
      label: "Системная / общественная"
      description: "Проблема на уровне государства, институтов, общества"

  disability_models:
    - id: "med_model"
      label: "Медицинская модель"
      description: "Инвалидность как дефект, который нужно лечить/исправлять"
    - id: "social"
      label: "Социальная модель"
      description: "Инвалидность как результат барьеров в обществе"
    - id: "charity"
      label: "Благотворительная модель"
      description: "Люди с инвалидностью как объекты помощи и жалости"
    - id: "rights_model"
      label: "Правозащитная модель"
      description: "Инвалидность как вопрос прав человека"
    - id: "mixed"
      label: "Смешанная"
      description: "Элементы нескольких моделей"

  agency_types:
    - id: "active_subject"
      label: "Активный субъект"
      description: "Человек с инвалидностью сам действует, решает, высказывается"
    - id: "passive_object"
      label: "Пассивный объект"
      description: "О человеке с инвалидностью говорят, за него решают"

  portrayal_types:
    - id: "victim"
      label: "Жертва"
      description: "Человек с инвалидностью представлен как жертва обстоятельств"
    - id: "inspiration"
      label: "Вдохновляющий пример"
      description: "Человек с инвалидностью как герой/вдохновение (inspiration porn)"
    - id: "normal"
      label: "Обычный человек"
      description: "Инвалидность не акцентируется, человек показан как обычный"

  target_audiences:
    - id: "pwd"
      label: "Людям с инвалидностью"
      description: "Сообщение адресовано людям с инвалидностью"
    - id: "relatives"
      label: "Родственникам / опекунам"
      description: "Сообщение адресовано родственникам или опекунам"
    - id: "professionals"
      label: "Специалистам"
      description: "Медикам, педагогам, соцработникам"
    - id: "general_public"
      label: "Широкой аудитории"
      description: "Сообщение адресовано широкой общественности"
    - id: "authorities"
      label: "Чиновникам / органам власти"
      description: "Обращение к власти, государственным структурам"
    - id: "donors"
      label: "Благотворителям / спонсорам"
      description: "Призыв к жертвователям, меценатам"

  barriers:
    - id: "physical"
      label: "Физические / архитектурные"
      description: "Пандусы, транспорт, здания, инфраструктура"
    - id: "informational"
      label: "Информационные / коммуникационные"
      description: "Отсутствие сурдоперевода, шрифта Брайля, доступных форматов"
    - id: "institutional"
      label: "Институциональные / бюрократические"
      description: "Оформление льгот, МСЭ, бюрократические процедуры"
    - id: "attitudinal"
      label: "Социальные / аттитюдные"
      description: "Предрассудки, дискриминация, непринятие обществом"
    - id: "financial"
      label: "Финансовые"
      description: "Стоимость лечения, ТСР, реабилитации"

  stigma_types:
    - id: "direct"
      label: "Прямая стигматизация"
      description: "Автор стигматизирует людей с инвалидностью"
    - id: "self"
      label: "Самостигматизация"
      description: "Автор с инвалидностью стигматизирует себя"
    - id: "counter"
      label: "Противостояние стигме"
      description: "Борьба со стереотипами, развенчание мифов"

llm:
  model: "gpt-5.4-mini"
  temperature: 0.0
  # Уровень рассуждений модели (none, minimal, low, medium, high, xhigh).
  # Если задан -- temperature игнорируется.
  reasoning_effort: "medium"
  batch_size: 5
  max_concurrent: 10
